name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: salesarmy, POSTGRES_PASSWORD: salesarmy, POSTGRES_DB: salesarmy_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://salesarmy:salesarmy@localhost:5432/salesarmy_test
      DATABASE_URL: postgres://salesarmy:salesarmy@localhost:5432/salesarmy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability scan (production deps)
        run: npm audit --omit=dev --audit-level=moderate
