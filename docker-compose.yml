# Local/self-hosted stack: PostgreSQL + web + worker. For managed hosting see DEPLOYMENT.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salesarmy
      POSTGRES_PASSWORD: salesarmy
      POSTGRES_DB: salesarmy
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  migrate:
    build: .
    command: npm run db:migrate
    env_file: .env
    environment: { DATABASE_URL: postgres://salesarmy:salesarmy@db:5432/salesarmy }
    depends_on: [db]
  web:
    build: .
    env_file: .env
    environment: { DATABASE_URL: postgres://salesarmy:salesarmy@db:5432/salesarmy }
    ports: ["3000:3000"]
    depends_on: [migrate]
  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment: { DATABASE_URL: postgres://salesarmy:salesarmy@db:5432/salesarmy }
    depends_on: [migrate]
    restart: unless-stopped
volumes:
  pgdata: {}
